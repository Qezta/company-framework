version = 1

# Code written for company-framework.
[[annotations]]
path = [
  "flake.nix",
  "flake.lock",
  "flake-module.nix",
  "*.md",
  "*.json",
  "*.toml",
  ".*",
  ".*/**",
  "flake/**",
  "lib/**",
  "modules/**",
  "pkgs/**",
  "tools/**",
  "tests/**",
  "docs/**",
  "schemas/**",
  "mcp/**",
  "opa/**",
  "LICENSES/MIT.txt",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Qezta (OPC) Pvt. Ltd."
SPDX-License-Identifier = "MIT"

# Example content, the starter template, and generated exports. These
# illustrate the framework; they are not a claim over downstream projects.
[[annotations]]
path = ["examples/**", "templates/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Qezta (OPC) Pvt. Ltd."
SPDX-License-Identifier = "MIT"

# Specs shipped for validation. Their copyright stays with the upstream authors.
[[annotations]]
path = ["vendor/**"]
precedence = "override"
SPDX-FileCopyrightText = "The Backstage Authors; The Serverless Workflow Specification Authors"
SPDX-License-Identifier = "Apache-2.0"
