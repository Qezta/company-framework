  name: "engineering"
spec:
  children:
    - "group:default/platform"
  parent: "group:default/founder"
  type: "team"
---
apiVersion: "backstage.io/v1alpha1"
kind: "Group"
metadata:
  description: "Books, invoicing and tax."
  name: "finance"
spec:
  children: []
  parent: "group:default/operations"
  type: "team"
---
apiVersion: "backstage.io/v1alpha1"
